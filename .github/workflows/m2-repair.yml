name: M2 Repair Verify

on:
  push:
    branches:
      - product/m2-workspace-os

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: zeus
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d zeus"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      NEON_AUTH_BASE_URL: https://auth.example.invalid/zeus/auth
      NEON_AUTH_COOKIE_SECRET: ci-cookie-secret-that-is-longer-than-thirty-two-characters
      DATABASE_URL: postgresql://ci:ci@localhost:5432/zeus
    steps:
      - uses: actions/checkout@v5
        with:
          ref: product/m2-workspace-os
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Repair strict task type narrowing
        shell: python
        run: |
          from pathlib import Path
          path = Path('apps/web/lib/product.ts')
          text = path.read_text()
          old = '''  const priority: TaskPriority = isTaskPriority(input.priority ?? "") ? input.priority : "medium";'''
          new = '''  const requestedPriority = input.priority ?? "medium";\n  const priority: TaskPriority = isTaskPriority(requestedPriority) ? requestedPriority : "medium";'''
          if old not in text:
              raise SystemExit('createTask priority target not found')
          text = text.replace(old, new, 1)
          old = '''  if (!isTaskStatus(input.status)) throw new Error("Unknown task status.");\n  if (!isTaskPriority(input.priority)) throw new Error("Unknown task priority.");'''
          new = '''  const status = input.status;\n  const priority = input.priority;\n  if (!isTaskStatus(status)) throw new Error("Unknown task status.");\n  if (!isTaskPriority(priority)) throw new Error("Unknown task priority.");'''
          if old not in text:
              raise SystemExit('updateTask validation target not found')
          text = text.replace(old, new, 1)
          text = text.replace('assertTaskTransition(current.status, input.status);', 'assertTaskTransition(current.status, status);', 1)
          text = text.replace('''        status: input.status,\n        priority: input.priority,''', '''        status,\n        priority,''', 1)
          text = text.replace('''        completedAt: input.status === "completed" ? new Date() : null,''', '''        completedAt: status === "completed" ? new Date() : null,''', 1)
          text = text.replace('''      payload: { status: input.status, assignedAgent: input.assignedAgent ?? null },''', '''      payload: { status, assignedAgent: input.assignedAgent ?? null },''', 1)
          path.write_text(text)
      - run: pnpm format:write
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Verify M2 migrations and RLS
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/db/migrations/0001_foundation.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/db/migrations/0002_workspace_os.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/db/migrations/0003_workspace_collaboration_security.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/rls.sql
      - run: pnpm build
      - name: Commit verified repair
        run: |
          git config user.name zeus-product-bot
          git config user.email actions@users.noreply.github.com
          git add apps/web/lib/product.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: preserve validated task enum types"
          git push origin HEAD:product/m2-workspace-os
