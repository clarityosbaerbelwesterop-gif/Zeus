name: M4 Format Repair

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: product/m4-kai-coding-agent
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Repair callback bindings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/lib/kai-coding-tools.ts')
          s = p.read_text()
          s = s.replace('    parse: input.parse,\n    execute: input.execute,', '    parse: (value) => input.parse(value),\n    execute: (value, context) => input.execute(value, context),', 1)
          p.write_text(s)
          PY
      - run: pnpm exec prettier --write apps/web/lib/kai-coding-tools.ts packages/db/src/m4-schema.ts packages/runtime/src/m4-boundaries.ts
      - run: pnpm format
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/kai-coding-tools.ts packages/db/src/m4-schema.ts packages/runtime/src/m4-boundaries.ts
          git commit -m "fix(m4): satisfy lint and formatting gates"
          git push origin HEAD:product/m4-kai-coding-agent
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
