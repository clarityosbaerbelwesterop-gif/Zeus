name: M3 Bootstrap Verify

on:
  push:
    branches: [product/m3-agent-runtime]

permissions:
  contents: write

env:
  NEON_AUTH_BASE_URL: https://auth.example.invalid/zeus/auth
  NEON_AUTH_COOKIE_SECRET: ci-cookie-secret-that-is-longer-than-thirty-two-characters
  DATABASE_URL: postgresql://ci:ci@localhost:5432/zeus

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: zeus
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U ci -d zeus"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Normalize M3 formatting once
        run: |
          pnpm exec prettier --write packages/agents/src/index.ts packages/runtime/src/context.ts packages/runtime/src/engine.ts packages/runtime/src/m4-boundaries.ts packages/runtime/src/openrouter.ts
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packages/agents/src/index.ts packages/runtime/src/context.ts packages/runtime/src/engine.ts packages/runtime/src/m4-boundaries.ts packages/runtime/src/openrouter.ts
            git commit -m "style(m3): normalize runtime formatting"
            git push origin HEAD:product/m3-agent-runtime
          fi
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Verify migrations and direct runtime RLS
        run: |
          for migration in packages/db/migrations/*.sql; do psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"; done
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/rls.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/runtime_rls.sql
      - run: pnpm build
