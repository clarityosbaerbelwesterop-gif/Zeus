name: Zeus branch autofix

on:
  push:
    branches:
      - product/final-prebilling-production

permissions:
  contents: write

jobs:
  prettier:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: product/final-prebilling-production
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format branch changes
        run: >-
          pnpm exec prettier --write
          apps/web/app/app/autopilot-actions.ts
          apps/web/components/workspace-autopilot.tsx
          apps/web/lib/business-autopilot.ts
          tests/unorouter.test.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/app/autopilot-actions.ts apps/web/components/workspace-autopilot.tsx apps/web/lib/business-autopilot.ts tests/unorouter.test.ts
          git commit -m "style: format autopilot changes"
          git push origin HEAD:product/final-prebilling-production
