name: M4 Branch Repair

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: product/m4-kai-coding-agent
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python scripts/m4_integrate.py
      - run: pnpm exec prettier --write apps/web/lib/agent-runtime.ts apps/web/app/app/actions.ts apps/web/components/workspace-run-panel.tsx packages/agents/src/index.ts packages/runtime/src/m4-boundaries.test.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Commit M4 integration
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/agent-runtime.ts apps/web/app/app/actions.ts apps/web/components/workspace-run-panel.tsx packages/agents/src/index.ts packages/runtime/src/m4-boundaries.test.ts
          git commit -m "feat(m4): wire Kai execution and approval flow"
          git push origin HEAD:product/m4-kai-coding-agent
