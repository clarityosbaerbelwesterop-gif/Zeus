name: Temporary runtime budget wiring

on:
  push:
    branches:
      - feat/wire-runtime-budget-ledger

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/wire-runtime-budget-ledger
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: node scripts/wire-runtime-budget.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:write
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/runtime/src/engine.ts packages/runtime/src/budget.ts apps/web/lib/agent-runtime.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Enforce persistent per-run model budgets"
          git push origin HEAD:feat/wire-runtime-budget-ledger
