name: UnoRouter Credential Probe

on:
  push:
    branches: [ops/unorouter-free-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    environment: production
    env:
      KEY1: ${{ secrets.UNOROUTER_API_KEY_1 }}
      KEY2: ${{ secrets.UNOROUTER_API_KEY_2 }}
      MODEL: glm-5.2:free
    steps:
      - name: Probe both credentials without disclosure
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            slot="$1"
            key="$2"
            [ -n "$key" ] || { echo "$slot: missing"; return 1; }
            response="$(mktemp)"
            payload="$(jq -cn --arg model "$MODEL" '{model:$model,messages:[{role:"user",content:"Reply with OK only."}],max_tokens:8}')"
            code="$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              -o "$response" -w '%{http_code}' \
              -X POST 'https://api.unorouter.com/v1/chat/completions' \
              -H "Authorization: Bearer $key" \
              -H 'Content-Type: application/json' \
              --data "$payload")"
            error_code="$(jq -r '.error.code // empty' "$response" 2>/dev/null || true)"
            rm -f "$response"
            if [[ "$code" == 2* ]]; then
              echo "$slot: success (HTTP $code)"
              return 0
            fi
            if [ -n "$error_code" ]; then
              echo "$slot: failed (HTTP $code, code=$error_code)"
            else
              echo "$slot: failed (HTTP $code)"
            fi
            return 1
          }
          ok=0
          probe primary "$KEY1" && ok=1 || true
          probe fallback "$KEY2" && ok=1 || true
          [ "$ok" -eq 1 ] || exit 1
