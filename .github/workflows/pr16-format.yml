name: Temporary PR16 formatter

on:
  push:
    branches:
      - release/v1-prestripe-consolidation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release/v1-prestripe-consolidation
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/lib/business-autopilot.ts packages/db/src/operating-schema.ts packages/runtime/src/operating-layer.ts
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/business-autopilot.ts packages/db/src/operating-schema.ts packages/runtime/src/operating-layer.ts
          git commit -m "style: apply canonical Prettier formatting"
          git push
