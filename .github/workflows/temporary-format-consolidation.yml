name: Temporary consolidation formatter

on:
  push:
    branches:
      - feat/consolidate-odin-runtime-guardrails

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/consolidate-odin-runtime-guardrails
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:write
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/REPOSITORY_CONSOLIDATION_AUTHORITY.md packages/runtime/src/budget.ts packages/runtime/src/budget.test.ts packages/runtime/src/checkpoint.ts packages/runtime/src/checkpoint.test.ts
          git commit -m "Format consolidation guardrails"
          git push origin HEAD:feat/consolidate-odin-runtime-guardrails
