name: M3 Format Repair

on:
  push:
    branches: [product/m3-agent-runtime]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: product/m3-agent-runtime
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/lib/agent-runtime.ts
      - name: Commit formatting repair
        shell: bash
        run: |
          if git diff --quiet -- apps/web/lib/agent-runtime.ts; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/agent-runtime.ts
          git commit -m "fix(m3): apply canonical formatting"
          git push origin HEAD:product/m3-agent-runtime
