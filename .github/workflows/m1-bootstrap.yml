name: M1 Bootstrap Verify

on:
  push:
    branches: [product/m1-foundation]

permissions:
  contents: write

env:
  NEON_AUTH_BASE_URL: https://auth.example.invalid/zeus/auth
  NEON_AUTH_COOKIE_SECRET: ci-cookie-secret-that-is-longer-than-thirty-two-characters
  DATABASE_URL: postgresql://ci:ci@localhost:5432/zeus

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: zeus
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d zeus"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: product/m1-foundation
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm format:write
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Verify migration and cross-tenant RLS
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/db/migrations/0001_foundation.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/rls.sql
      - run: pnpm build
      - name: Commit lockfile and normalized formatting
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --porcelain)" ]; then exit 0; fi
          git config user.name zeus-product-bot
          git config user.email actions@users.noreply.github.com
          git add pnpm-lock.yaml .
          git commit -m "chore: lock and normalize M1 foundation"
          git push origin HEAD:product/m1-foundation
