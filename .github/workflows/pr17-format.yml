name: Temporary PR17 formatter

on:
  push:
    branches:
      - release/v1-prestripe-final

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release/v1-prestripe-final
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/app/page.tsx apps/web/app/privacy/page.tsx apps/web/app/terms/page.tsx apps/web/app/data-controls/page.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/page.tsx apps/web/app/privacy/page.tsx apps/web/app/terms/page.tsx apps/web/app/data-controls/page.tsx
          git commit -m "style: format legal surfaces"
          git push
