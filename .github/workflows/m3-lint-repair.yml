name: M3 Lint Repair

on:
  push:
    branches: [product/m3-agent-runtime]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: product/m3-agent-runtime
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Remove unnecessary async from synchronous authorization hook
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/lib/agent-runtime.ts')
          text = path.read_text()
          old = '    async authorizeTool(run, tool) {'
          new = '    authorizeTool(run, tool) {'
          if old not in text:
              raise SystemExit('expected authorizeTool signature not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: pnpm exec prettier --write apps/web/lib/agent-runtime.ts
      - run: pnpm lint
      - name: Commit lint repair
        shell: bash
        run: |
          if git diff --quiet -- apps/web/lib/agent-runtime.ts; then
            echo "No lint changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/agent-runtime.ts
          git commit -m "fix(m3): satisfy runtime lint gate"
          git push origin HEAD:product/m3-agent-runtime
