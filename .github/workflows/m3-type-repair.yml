name: M3 Type Repair

on:
  push:
    branches: [product/m3-agent-runtime]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: product/m3-agent-runtime
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Repair runtime authorization contract and optional query inputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          engine = Path('packages/runtime/src/engine.ts')
          text = engine.read_text()
          old = '  readonly authorizeTool: (run: RuntimeRun, tool: ToolDefinition) => Promise<void>;'
          new = '  readonly authorizeTool: (run: RuntimeRun, tool: ToolDefinition) => void | Promise<void>;'
          if old not in text:
              raise SystemExit('expected authorizeTool contract not found')
          engine.write_text(text.replace(old, new, 1))

          panel = Path('apps/web/components/workspace-run-panel.tsx')
          text = panel.read_text()
          old = '    runId ?? (await latestRuntimeRunId({ workspaceId, taskId, conversationId }));'
          new = '''    runId ??\n    (await latestRuntimeRunId({\n      workspaceId,\n      ...(taskId ? { taskId } : {}),\n      ...(conversationId ? { conversationId } : {}),\n    }));'''
          if old not in text:
              raise SystemExit('expected latestRuntimeRunId call not found')
          panel.write_text(text.replace(old, new, 1))
          PY
      - run: pnpm exec prettier --write packages/runtime/src/engine.ts apps/web/components/workspace-run-panel.tsx
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Commit type repair
        shell: bash
        run: |
          if git diff --quiet -- packages/runtime/src/engine.ts apps/web/components/workspace-run-panel.tsx; then
            echo "No type changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/runtime/src/engine.ts apps/web/components/workspace-run-panel.tsx
          git commit -m "fix(m3): satisfy strict runtime typing"
          git push origin HEAD:product/m3-agent-runtime
